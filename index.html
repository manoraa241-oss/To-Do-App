<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تطبيق المهام اليومية</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
    <style>
        /* خط شطب للمهام المكتملة */
        .completed {
            text-decoration: line-through;
            color: #6c757d;
        }
    </style>
</head>
<body class="bg-light py-5">

    <div class="container" style="max-width: 600px;">
        <div class="card shadow p-4">
            <h3 class="text-center mb-4 fw-bold">قائمة المهام اليومية</h3>

            <!-- ==================== نموذج إضافة المهام ==================== -->
            <div class="input-group mb-3">
                <input type="text" id="taskInput" class="form-control" placeholder="أدخل مهمة جديدة...">
                <button class="btn btn-primary" id="addTaskBtn">إضافة</button>
            </div>

            <!-- ==================== قائمة المهام Dynamically ==================== -->
            <ul class="list-group" id="taskList">
                <!-- سيتم إضافة المهام هنا بواسطة الجافاسكريبت -->
            </ul>
        </div>
    </div>

    <!-- ==================== كود الجافاسكريبت لإدارة المهام ==================== -->
    <script>
        // الروابط مع عناصر الواجهة
        const taskInput = document.getElementById('taskInput');
        const addTaskBtn = document.getElementById('addTaskBtn');
        const taskList = document.getElementById('taskList');

        // دالة إضافة مهمة جديدة
        function addTask() {
            const taskText = taskInput.value.trim();
            if (taskText === '') return; // عدم إضافة عناصر فارغة

            // إنشاء عنصر li جديد
            const li = document.createElement('li');
            li.className = 'list-group-item d-flex justify-content-between align-items-center';
            li.innerHTML = `
                <span class="task-text">${taskText}</span>
                <div>
                    <button class="btn btn-sm btn-success me-1 complete-btn">✓</button>
                    <button class="btn btn-sm btn-danger delete-btn">✗</button>
                </div>
            `;

            // إضافة حدث الإنهاء (Complete)
            li.querySelector('.complete-btn').addEventListener('click', () => {
                li.querySelector('.task-text').classList.toggle('completed');
            });

            // إضافة حدث الحذف (Delete)
            li.querySelector('.delete-btn').addEventListener('click', () => {
                li.remove();
            });

            // إدراج المهمة في القائمة وتفريغ الإدخال
            taskList.appendChild(li);
            taskInput.value = '';
        }

        // تشغيل الدالة عند الضغط على زر الإضافة
        addTaskBtn.addEventListener('click', addTask);
    </script>
</body>
</html>
